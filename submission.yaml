submission:
  title: "Evidence Triage Console — AI-Assisted Crime Scene Evidence Prioritization"   # REQUIRED

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Major crime scenes produce hundreds of items and thousands of photographs
    (the 2019 Hyderabad homicide: 3,000+ photos, 200+ items, and a DNA-bearing
    cigarette butt nearly missed on the first sweep), while overloaded Forensic
    Science Laboratories delay testing by weeks. Investigating officers and FSL
    examiners have no fast, defensible way to decide what to examine first.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    An investigator lists recovered items in plain language; IBM Bob (Bob Shell) extracts and classifies each item, and a deterministic
    Python engine scores, flags urgency and ranks them into an FSL examination
    schedule. Scoring runs on a versioned ruleset — or, on request, a case-tuned
    ruleset that the model proposes and the engine clamps, freezes and SHA-256
    hashes — so every schedule is exactly reproducible and auditable.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "IBM Bob drives the pipeline through MCP tools; the model extracts and classifies but never assigns a score, rank or urgency."
    - "Case-tuned rulesets: the model proposes scene-specific weights, multipliers and baselines across 8 evaluation angles; the engine clamps, freezes and hashes them before scoring."
    - "Pure deterministic scoring engine (Decimal, ROUND_HALF_UP): identical input and ruleset give byte-identical output, pinned by 57 tests including a 1000x determinism check."
    - "Independent urgency rule (score threshold OR force-urgent safety flags) so perishable or volatile evidence is never buried."
    - "SQLite audit log with the verbatim model output; /audit?verify re-hashes the stored ruleset and re-scores every item to prove a past schedule reproduces."

  tech_stack:
    languages: ["Python", "JavaScript", "HTML", "CSS"]
    frameworks: ["FastAPI", "Pydantic v2", "Uvicorn", "pytest"]
    ibm_technologies: ["IBM Bob (MCP integration)", "IBM Bob Shell (LLM call routing)", "IBM watsonx.ai (Granite)"]
    databases: ["SQLite"]
    other: ["Model Context Protocol (MCP)", "PyYAML", "GitHub Actions"]

  what_we_are_most_proud_of: >
    The split between language and decision. Bob reads the scene and classifies
    it; the priority comes from a versioned (or case-tuned, clamped and frozen)
    ruleset applied by pure Python. For any schedule we can show the exact
    arithmetic and ruleset hash behind every rank, and /audit?verify proves it
    reproduces — see src/app/scoring.py, src/app/ruleset_generator.py and
    src/tests/.

  known_limitations: >
    With no model configured, extraction uses a deterministic keyword classifier
    (demo/CI path); production classification quality depends on watsonx Granite
    or Bob Shell. Base weights (rules v1.1.1) are defensible defaults, not yet
    calibrated against real FSL case outcomes, and case-tuned rulesets are bounded
    model proposals, not validated policy.

